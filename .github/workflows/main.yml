name: Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
    
    - name: Install dependencies
      run: yarn install

    - name: Build
      run: yarn build

  docker:
    name: Docker Build
    needs: build
    runs-on: ubuntu-latest
    steps:
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ply3r/test-private:latest

  deploy:
    name: Deploy
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Setup ssh key
        run: | 
            mkdir -p ~/.ssh
            touch ~/.ssh/id_rsa
            echo "${{ secrets.SSH_KEY }}" >> ~/.ssh/id_rsa
            echo "${{ secrets.SSH_CONFIG }}" >> ~/.ssh/
            chmod 400 ~/.ssh/id_rsa

      - name: Pull Docker image
        run: |
          ssh ec2-user@${{ secrets.EC2_HOST }} "
          sudo docker login --username ${{ secrets.DOCKERHUB_USERNAME }} --password ${{ secrets.DOCKERHUB_TOKEN }}; 
          sudo docker pull ply3r/test-private:latest;"
      
      - name: Run Image
        run: |
          ssh ec2-user@${{ secrets.EC2_HOST }} "
          sudo docker login --username ${{ secrets.DOCKERHUB_USERNAME }} --password ${{ secrets.DOCKERHUB_TOKEN }};
          sudo docker run -p 80:80 ply3r/test-private:latest"


      
