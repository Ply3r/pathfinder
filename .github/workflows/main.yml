name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Copy packege.json
      run: |
        mkdir app
        cp -r packege.json app/

    - name: Install dependencies
      run: yarn install

    - name: Copy app
      run: cp -r * app/

    - name: Build
      run: yarn build

